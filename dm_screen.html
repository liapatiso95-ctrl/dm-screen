  {n:"Cartographer's Tools",d:"Artisan's Tools · 15 gp · 6 lb · Ability: Wisdom\n\nCreate accurate maps, from mountain ranges to dungeon levels.\n\nComponents. A quill, ink, parchment, a pair of compasses, calipers, and a ruler.\n\nUtilize (2024). Draft a map of a small area (DC 15).\n\nSample DCs (2014). Determine a map's age and origin 10 · Estimate direction/distance to a landmark 15 · Discern a map is fake 15 · Fill in a missing part 20.\n\nCraft (2024). Map.\n\nExamples of Advantage on a Roll\n\nArcana, History, Religion. Unearth detailed information — spot hidden messages, identify when a map was made, etc.\n\nNature. Answer questions relating to surrounding terrain.\n\nSurvival. Find paths to civilization, predict settlements, avoid getting lost.\n\nTool Features\n\nCraft a Map (2014). Draw a map as you travel, in addition to other activity."},
  {n:"Cobbler's Tools",d:"Artisan's Tools · 5 gp · 5 lb · Ability: Dexterity\n\nA good pair of boots sees a character across rugged wilderness and deadly dungeons.\n\nComponents. A hammer, awl, knife, shoe stand, cutter, spare leather, and thread.\n\nUtilize (2024). Modify footwear to give Advantage on the wearer's next Dexterity (Acrobatics) check (DC 10).\n\nSample DCs (2014). Determine a shoe's age and origin 10 · Find a hidden compartment in a boot heel 15.\n\nCraft (2024). Climber's Kit.\n\nExamples of Advantage on a Roll\n\nArcana, History. Identify magical properties or history of enchanted boots.\n\nInvestigation. Learn where someone recently visited by examining wear and dirt on shoes.\n\nTool Features\n\nMaintain Shoes (2014). On a long rest, repair companions' shoes; for 24 hours up to six creatures can travel up to 10 hours/day without exhaustion saves.\n\nCraft Hidden Compartment (2014). 8 hours of work adds a compartment (up to 3×1×1 in) to a pair of shoes."},
  {n:"Cook's Utensils",d:"Artisan's Tools · 1 gp · 8 lb · Ability: Wisdom\n\nWith a cook along, meals are much better than hardtack and dried fruit.\n\nComponents. A metal pot, knives, forks, a stirring spoon, and a ladle.\n\nUtilize (2024). Improve food's flavor (DC 10), or detect spoiled or poisoned food (DC 15).\n\nSample DCs (2014). Create a typical meal 10 · Duplicate a meal 10 · Spot poison/impurities in food 15 · Create a gourmet meal 15.\n\nCraft (2024). Rations.\n\nExamples of Advantage on a Roll\n\nHistory. Assess social patterns in a culture's eating habits.\n\nMedicine. Transform bitter or sour medicine into a pleasing concoction.\n\nSurvival. Make do with scavenged ingredients others couldn't use.\n\nTool Features\n\nPrepare Meals (2014). As part of a short rest, you and up to five creatures regain 1 extra hit point per Hit Die spent, given food and your utensils."},
  {n:"Disguise Kit",d:"Tool · 25 gp · 3 lb · Ability: Charisma\n\nAdopt a false identity.\n\nComponents. Cosmetics, hair dye, small props, and a few pieces of clothing.\n\nUtilize (2024). Apply makeup (DC 10).\n\nSample DCs (2014). Cover injuries/marks 10 · Spot a disguise on someone else 15 · Copy a humanoid's appearance 20.\n\nCraft (2024). Costume.\n\nExamples of Advantage on a Roll\n\nDeception. A disguise can improve convincing lies.\n\nIntimidation. The right disguise can make you look more fearsome.\n\nPerformance. A cunning disguise can enhance a performance.\n\nPersuasion. Disguised as an authority figure, persuasion is more effective.\n\nTool Features\n\nCreate Disguise (2014). As part of a long rest; takes 1 minute to don. Carry only one without drawing attention (each weighs 1 lb). 10 min for moderate changes, 30 min for extensive."},
  {n:"Forgery Kit",d:"Tool · 15 gp · 5 lb · Ability: Dexterity\n\nDuplicate documents and copy a person's seal or signature.\n\nComponents. Several inks, parchments and papers, quills, seals and sealing wax, gold and silver leaf, and small tools to sculpt wax.\n\nUtilize (2024). Mimic 10 or fewer words of someone else's handwriting (DC 15), or duplicate a wax seal (DC 20).\n\nSample DCs (2014). Mimic handwriting 15 · Duplicate a wax seal 20.\n\nExamples of Advantage on a Roll\n\nArcana. Determine if a magic item is real or fake.\n\nDeception. A well-crafted forgery lends credence to a lie.\n\nHistory. Create fake historical documents or tell if an old document is authentic.\n\nInvestigation. Determine how an object was made and whether it is genuine.\n\nOther Tools. Combine with other tool proficiencies (e.g. cartographer's) for more believable forgeries.\n\nTool Features\n\nQuick Fake (2014). Short rest: a one-page forged document. Long rest: up to four pages. Your check sets the DC to spot it."},
  {n:"Gaming Set",d:"Cost: 1 sp · Ability: Wisdom\n\nProficiency applies to one type of game (e.g. Three-Dragon Ante or dice games).\n\nComponents. All pieces needed for a specific game — a deck of cards or a board and tokens.\n\nUtilize (2024). Discern whether someone is cheating (DC 10), or win the game (DC 20).\n\nSample DCs (2014). Catch a player cheating 15 · Gain insight into an opponent's personality 15.\n\nExamples of Advantage on a Roll\n\nHistory. Knowledge of a game's history and figures connected to it.\n\nInsight. Playing games reveals personality, helping you read lies and mood.\n\nSleight of Hand. Cheat by swapping pieces, palming cards, or altering a die; or distract for a pickpocket attempt."},
  {n:"Glassblower's Tools",d:"Artisan's Tools · 30 gp · 5 lb · Ability: Intelligence\n\nShape glass and know the methods used to produce glass objects.\n\nComponents. A blowpipe, a small marver, blocks, and tweezers. You need a source of heat.\n\nUtilize (2024). Discern what a glass object held in the past 24 hours (DC 15).\n\nSample DCs (2014). Identify source of glass 10 · Determine what a glass object once held 20.\n\nCraft (2024). Glass Bottle, Magnifying Glass, Spyglass, Vial.\n\nExamples of Advantage on a Roll\n\nArcana, History. Examine glass objects such as potion bottles or treasure-hoard glass; residue or deformation can hint at a potion's effects.\n\nInvestigation. Aid when clues include broken glass or glass objects.\n\nTool Features\n\nIdentify Weakness (2014). 1 minute of study identifies weak points; damage to a weak spot is doubled."},
  {n:"Herbalism Kit",d:"Tool · 5 gp · 3 lb · Ability: Intelligence\n\nIdentify plants and safely collect their useful elements.\n\nComponents. Pouches to store herbs, clippers and leather gloves, a mortar and pestle, and several glass jars.\n\nUtilize (2024). Identify a plant (DC 10).\n\nSample DCs (2014). Find plants 15 · Identify poison 20.\n\nCraft (2024). Antitoxin, Candle, Healer's Kit, Potion of Healing.\n\nExamples of Advantage on a Roll\n\nArcana. Insight into magical studies dealing with plants and identifying potions.\n\nInvestigation. Pick out details and clues in plant-overgrown areas.\n\nMedicine. Treat illnesses and wounds with medicinal plants.\n\nNature and Survival. Identify plants and spot food in the wild.\n\nTool Features\n\nIdentify Plants (2014). Identify most plants with a quick inspection."},
  {n:"Jeweler's Tools",d:"Artisan's Tools · 25 gp · 2 lb · Ability: Intelligence\n\nBeautify gems and identify precious stones.\n\nComponents. A small saw and hammer, files, pliers, and tweezers.\n\nUtilize (2024). Discern a gem's value (DC 15).\n\nSample DCs (2014). Modify a gem's appearance 15 · Determine a gem's history 20.\n\nCraft (2024). Arcane Focus, Holy Symbol.\n\nExamples of Advantage on a Roll\n\nArcana. Knowledge of the reputed mystical uses of gems.\n\nInvestigation. Pick out clues in jeweled objects.\n\nTool Features\n\nIdentify Gems (2014). Identify gems and determine their value at a glance."},
  {n:"Land and Water Vehicles",d:"Handle, repair, and maintain vehicles of that type. Water-vehicle proficiency also covers sailor's knowledge (the sea, knots, weather).\n\nSample DCs (2014). Navigate rough terrain/waters 10 · Assess a vehicle's condition 15 · Take a tight corner at high speed 20.\n\nExamples of Advantage on a Roll\n\nArcana. Uncover lore or determine how a magic vehicle operates.\n\nInvestigation, Perception. Notice things others miss when inspecting a vehicle.\n\nTool Features\n\nVehicle Handling (2014). While piloting, apply your proficiency bonus to the vehicle's AC and saving throws."},
  {n:"Leatherworker's Tools",d:"Artisan's Tools · 5 gp · 5 lb · Ability: Dexterity\n\nLore concerning animal hides and leather goods.\n\nComponents. A knife, a small mallet, an edger, a hole punch, thread, and leather scraps.\n\nUtilize (2024). Add a design to a leather item (DC 10).\n\nSample DCs (2014). Modify a leather item's appearance 10 · Determine a leather item's history 20.\n\nCraft (2024). Sling, Whip, Hide Armor, Leather Armor, Studded Leather Armor, Backpack, Crossbow Bolt Case, Map or Scroll Case, Parchment, Pouch, Quiver, Waterskin.\n\nExamples of Advantage on a Roll\n\nArcana. Insight inspecting magic items crafted from leather (boots, some cloaks).\n\nInvestigation. Insight studying leather items or related clues.\n\nTool Features\n\nIdentify Hides (2014). Determine the source of leather and techniques used (e.g. dwarven vs halfling methods)."},
  {n:"Mason's Tools",d:"Artisan's Tools · 10 gp · 8 lb · Ability: Strength\n\nCraft stone and brick structures.\n\nComponents. A trowel, hammer, chisel, brushes, and a square.\n\nUtilize (2024). Chisel a symbol or hole in stone (DC 10).\n\nSample DCs (2014). Chisel a small hole in a stone wall 10 · Find a weak point in a stone wall 15.\n\nCraft (2024). Block and Tackle.\n\nExamples of Advantage on a Roll\n\nHistory. Identify a stone building's date, purpose, and likely builder.\n\nInvestigation. Insight inspecting areas within stone structures.\n\nPerception. Spot irregularities in stone walls or floors (trap doors, secret passages).\n\nTool Features\n\nDemolition (2014). Spot weak points in brick walls; deal double damage to such structures with weapon attacks."},
  {n:"Musical Instrument",d:"Familiarity with techniques to play an instrument and knowledge of common songs.\n\nSample DCs (2014). Identify a tune 10 · Improvise a tune 20.\n\nExamples of Advantage on a Roll\n\nHistory. Recall lore related to your instrument.\n\nPerformance. Improve your act by incorporating an instrument.\n\nTool Features\n\nCompose a Tune (2014). As part of a long rest, compose a new tune and lyrics."},
  {n:"Navigator's Tools",d:"Tool · 25 gp · 2 lb · Ability: Wisdom\n\nDetermine a true course by the stars; insight into charts and direction.\n\nComponents. A sextant, compass, calipers, ruler, parchment, ink, and a quill.\n\nUtilize (2024). Plot a course (DC 10), or determine position by stargazing (DC 15).\n\nSample DCs (2014). Plot a course 10 · Discover your position on a nautical chart 15.\n\nExamples of Advantage on a Roll\n\nSurvival. Avoid getting lost; insight into likely roads and settlements.\n\nTool Features\n\nSighting (2014). Determine your position on a nautical chart and the time of day."},
  {n:"Painter's Supplies",d:"Artisan's Tools · 10 gp · 5 lb · Ability: Wisdom\n\nPaint and draw, with an understanding of art history.\n\nComponents. An easel, canvas, paints, brushes, charcoal sticks, and a palette.\n\nUtilize (2024). Paint a recognizable image of something you've seen (DC 10).\n\nSample DCs (2014). Paint an accurate portrait 10 · Create a painting with a hidden message 20.\n\nCraft (2024). Druidic Focus, Holy Symbol.\n\nExamples of Advantage on a Roll\n\nArcana, History, Religion. Uncover lore attached to a work of art.\n\nInvestigation, Perception. Insight when inspecting a painting or visual art.\n\nTool Features\n\nPainting and Drawing (2014). As part of a short or long rest, produce a simple work of art or a quick copy."},
  {n:"Poisoner's Kit",d:"Tool · 50 gp · 2 lb · Ability: Intelligence\n\nApply and create poisons, and treat them.\n\nComponents. Glass vials, a mortar and pestle, chemicals, and a glass stirring rod.\n\nUtilize (2024). Detect a poisoned object (DC 10).\n\nSample DCs (2014). Spot a poisoned object 10 · Determine the effects of a poison 20.\n\nCraft (2024). Basic Poison.\n\nExamples of Advantage on a Roll\n\nHistory. Recall facts about infamous poisonings.\n\nInvestigation, Perception. Edge inspecting poisoned objects or poison-related events.\n\nMedicine. Added insight treating a poison victim.\n\nNature, Survival. Lore about poisonous plants and animals.\n\nTool Features\n\nHandle Poison (2014). Handle and apply a poison without risk of exposing yourself."},
  {n:"Potter's Tools",d:"Artisan's Tools · 10 gp · 3 lb · Ability: Intelligence\n\nCreate ceramic objects, typically pots and vessels.\n\nComponents. Potter's needles, ribs, scrapers, a knife, and calipers.\n\nUtilize (2024). Discern what a ceramic object held in the past 24 hours (DC 15).\n\nSample DCs (2014). Determine what a vessel once held 10 · Create a serviceable pot 15 · Find a weak point in a ceramic object 20.\n\nCraft (2024). Jug, Lamp.\n\nExamples of Advantage on a Roll\n\nHistory. Identify ceramic objects' age and culture of origin.\n\nInvestigation, Perception. Insight inspecting ceramics for clues.\n\nTool Features\n\nReconstruction (2014). From shards, determine an object's original form and purpose."},
  {n:"Smith's Tools",d:"Artisan's Tools · 20 gp · 8 lb · Ability: Strength\n\nWork metal — alter shape, repair damage, or work ingots into items.\n\nComponents. Hammers, tongs, charcoal, rags, and a whetstone.\n\nUtilize (2024). Pry open a door or container (DC 20).\n\nSample DCs (2014). Sharpen a dull blade 10 · Repair a suit of armor 15 · Sunder a nonmagical metal object 15.\n\nCraft (2024). Any Melee weapon (except Club, Greatclub, Quarterstaff, Whip), Medium armor (except Hide), Heavy armor, Ball Bearings, Bucket, Caltrops, Chain, Crowbar, Firearm Bullets, Grappling Hook, Iron Pot, Iron Spikes, Sling Bullets.\n\nExamples of Advantage on a Roll\n\nArcana and History. Insight examining metal objects such as weapons.\n\nInvestigation. Spot clues when an investigation involves armor, weapons, or metalwork.\n\nTool Features\n\nRepair (2014). With tools and an open flame, restore 10 hit points to a damaged metal object per hour of work."},
  {n:"Thieves' Tools",d:"Tool · 25 gp · 1 lb · Ability: Dexterity\n\nPick locks and foil traps; general knowledge of traps and locks.\n\nComponents. A small file, lock picks, a small mirror on a handle, narrow-bladed scissors, and pliers.\n\nUtilize (2024). Pick a lock (DC 15), or disarm a trap (DC 15).\n\nSample DCs (2014). Pick a lock — Varies · Disable a trap — Varies.\n\nExamples of Advantage on a Roll\n\nHistory. Insight about locations renowned for their traps.\n\nInvestigation and Perception. Insight looking for traps via common tell-tale signs.\n\nTool Features\n\nSet a Trap (2014). As part of a short rest, create a trap; your check is the DC to discover or disable it."},
  {n:"Tinker's Tools",d:"Artisan's Tools · 50 gp · 10 lb · Ability: Dexterity\n\nRepair many mundane objects — mend clothes, sharpen a sword, patch chain mail.\n\nComponents. A variety of hand tools, thread, needles, a whetstone, scraps of cloth and leather, and a small pot of glue.\n\nUtilize (2024). Assemble a Tiny item composed of scrap, which falls apart in 1 minute (DC 20).\n\nSample DCs (2014). Temporarily repair a disabled device 10 · Repair an item in half the time 15 · Improvise a temporary item from scraps 20.\n\nCraft (2024). Musket, Pistol, Bell, Bullseye Lantern, Flask, Hooded Lantern, Hunting Trap, Lock, Manacles, Mirror, Shovel, Signal Whistle, Tinderbox.\n\nExamples of Advantage on a Roll\n\nHistory. Determine the age and origin of objects from a few remaining pieces.\n\nInvestigation. Learn how a damaged object was damaged and how long ago.\n\nTool Features\n\nRepair (2014). Restore 10 hit points to a damaged object per hour of work (materials required; metal needs an open flame)."},
  {n:"Weaver's Tools",d:"Artisan's Tools · 1 gp · 5 lb · Ability: Dexterity\n\nCreate cloth and tailor it into clothing.\n\nComponents. Thread, needles, and scraps of cloth. (A loom is too large to transport.)\n\nUtilize (2024). Mend a tear in clothing (DC 10), or sew a Tiny design (DC 10).\n\nSample DCs (2014). Repurpose cloth 10 · Mend a hole in cloth 10 · Tailor an outfit 15.\n\nCraft (2024). Padded Armor, Basket, Bedroll, Blanket, Fine Clothes, Net, Robe, Rope, Sack, String, Tent, Traveler's Clothes.\n\nExamples of Advantage on a Roll\n\nArcana, History. Insight examining cloth objects such as cloaks and robes.\n\nInvestigation. Spot clues others overlook when examining tapestries, upholstery, or clothing.\n\nTool Features\n\nRepair (2014). As part of a short rest, repair a single damaged cloth object.\n\nCraft Clothing (2014). With sufficient cloth and thread, create an outfit as part of a long rest."},
  {n:"Woodcarver's Tools",d:"Artisan's Tools · 1 gp · 5 lb · Ability: Dexterity\n\nCraft intricate objects from wood, such as tokens or arrows.\n\nComponents. A knife, a gouge, and a small saw.\n\nUtilize (2024). Carve a pattern in wood (DC 10).\n\nSample DCs (2014). Craft a small wooden figurine 10 · Carve an intricate pattern in wood 15.\n\nCraft (2024). Club, Greatclub, Quarterstaff, Ranged weapons (except Pistol, Musket, Sling), Arcane Focus, Arrows, Bolts, Druidic Focus, Ink Pen, Needles.\n\nExamples of Advantage on a Roll\n\nArcana, History. Insight examining wooden objects such as figurines or arrows.\n\nNature. Added insight when you examine trees.\n\nTool Features\n\nRepair (2014). As part of a short rest, repair a single damaged wooden object.\n\nCraft Arrows (2014). Short rest: up to five arrows. Long rest: up to twenty. Requires wood on hand."}
];

function ToolReferenceModal({onClose}){
  const {useState:us}=React;
  const [open,setOpen]=us({});
  const [q,setQ]=us("");
  function toggle(n){setOpen(function(e){var x=Object.assign({},e);x[n]=!x[n];return x;});}
  var list=TOOL_DATA.filter(function(t){return !q.trim()||t.n.toLowerCase().indexOf(q.toLowerCase())>=0;});
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,height:"100dvh",background:"rgba(0,0,0,.7)",zIndex:100000,display:"flex",alignItems:"center",justifyContent:"center",padding:12,boxSizing:"border-box"}}>
      <div onClick={function(e){e.stopPropagation();}} style={{background:"#1a1410",border:"1px solid rgba(201,150,42,.4)",borderRadius:4,maxWidth:560,width:"100%",maxHeight:"100%",display:"flex",flexDirection:"column",boxShadow:"0 8px 40px rgba(0,0,0,.8)"}}>
        <div style={{padding:"18px 22px 10px",borderBottom:"1px solid rgba(201,150,42,.15)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontFamily:"'Cinzel',serif",fontSize:14,letterSpacing:1,color:"var(--gold-l)",flex:1}}>Tool Proficiencies</span>
            <div onClick={onClose} title="Close" style={{cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:24,color:"rgba(232,213,176,.7)",lineHeight:1,padding:"6px 12px",margin:"-6px -8px -6px 0",flexShrink:0}}>×</div>
          </div>
          <input value={q} onChange={function(e){setQ(e.target.value);}} placeholder="Filter tools..." style={{marginTop:10,width:"100%",background:"rgba(0,0,0,.3)",border:"1px solid rgba(201,150,42,.2)",color:"var(--parch)",fontFamily:"'EB Garamond',serif",fontSize:13,outline:"none",padding:"6px 8px",borderRadius:2}} />
        </div>
        <div style={{overflowY:"auto",padding:"4px 0"}}>
          {list.map(function(t){
            var isO=open[t.n];
            return (
              <div key={t.n} style={{borderBottom:"1px solid rgba(201,150,42,.07)"}}>
                <div onClick={function(){toggle(t.n);}} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 22px",cursor:"pointer"}}>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:11,color:"rgba(201,150,42,.4)",width:12,flexShrink:0}}>{isO?"−":"+"}</span>
                  <span style={{fontFamily:"'EB Garamond',serif",fontSize:14,color:"var(--gold-l)",fontWeight:600}}>{t.n}</span>
                </div>
                {isO&&<div style={{padding:"2px 22px 14px 44px",fontFamily:"'EB Garamond',serif",fontSize:13,color:"rgba(232,213,176,.8)",lineHeight:1.65}}>
                  {t.d.split("\n\n").map(function(para,pi){
                    var isHdr=para==="Examples of Advantage on a Roll"||para==="Tool Features";
                    if(isHdr) return <div key={pi} style={{fontFamily:"'Cinzel',serif",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:"var(--gold-l)",marginTop:12,marginBottom:5,borderBottom:"1px solid rgba(201,150,42,.15)",paddingBottom:3}}>{para}</div>;
                    return <div key={pi} style={{marginBottom:7,whiteSpace:"pre-wrap"}}>{para}</div>;
                  })}
                </div>}
              </div>
            );
          })}
          {list.length===0&&<div style={{padding:"18px 22px",fontFamily:"'EB Garamond',serif",fontSize:13,fontStyle:"italic",color:"rgba(232,213,176,.3)"}}>No matching tool.</div>}
        </div>
      </div>
    </div>
  );
}

// ─── Species Compendium (races.md) ───────────────────────────────────────────
const SPECIES_MD_URL="https://raw.githubusercontent.com/liapatiso95-ctrl/character-sheet/main/races.md";
const _speciesCache={data:null,status:"idle"};
const _speciesListeners=[];
function _notifySpeciesListeners(){_speciesListeners.forEach(function(fn){fn();});}

// Parse the "Complete Guide to Sapient Species" Homebrewery markdown.
// Returns {key:{name,blurb,groups:[{label,feats:[{name,desc,cost,hasCost}]}]}}.
// Each "## Species" heading is one entry; "###" headings open subspecies groups;
// traits are lines that start with **Name. *(N points)*** and run until the next trait.
function parseSpeciesMd(text){
  var out={};
  if(!text) return out;
  text=text.replace(/\r/g,"");
  var si=text.search(/^# Species\s*$/m);
  if(si>=0) text=text.slice(si).replace(/^# Species\s*$/m,"");
  // Re-join costs split over a line break: "(3\npoints)"
  text=text.replace(/\(\s*(\d+)\s*\n\s*(points?)/gi,"($1 $2");
  var sections=text.split(/^## +/m).slice(1);
  sections.forEach(function(sec){
    var nl=sec.indexOf("\n");
    var name=(nl<0?sec:sec.slice(0,nl)).trim();
    if(!name) return;
    var body=nl<0?"":sec.slice(nl+1);
    var parts=body.split(/^### +/m);
    var groups=[],blurb="";
    parts.forEach(function(part,pi){
      var label,chunk;
      if(pi===0){label="General Traits";chunk=part;}
      else{var n2=part.indexOf("\n");label=(n2<0?part:part.slice(0,n2)).trim();chunk=n2<0?"":part.slice(n2+1);}
      var feats=_parseSpeciesTraits(chunk);
      if(pi===0){
        // flavor text = everything before the first #### heading / first trait
        var cut=chunk.search(/^#### |^\*\*[^*\n]+?\.[^\n]*?\*\*/m);
        blurb=_cleanSpeciesText(cut<0?chunk:chunk.slice(0,cut)).split(/\n\s*\n/)[0]||"";
      }
      if(feats.length) groups.push({label:label,feats:feats});
    });
    if(!groups.length) return;
    // Resolve "Darkvision + 1 point" style costs against the species' own traits
    var allF=[];groups.forEach(function(g){g.feats.forEach(function(f){allF.push(f);});});
    allF.forEach(function(f){
      if(f._ref){
        var base=0,rl=f._ref.toLowerCase().trim();
        for(var i=0;i<allF.length;i++){if(allF[i]!==f&&allF[i].name.toLowerCase()===rl&&allF[i]._own!=null){base=allF[i]._own;break;}}
        if(!base){var gen={darkvision:3};base=gen[rl]||0;}
        f.cost=base+f._refAdd;
      }
      delete f._ref;delete f._refAdd;delete f._own;
    });
    out[name.toLowerCase()]={name:name,key:name.toLowerCase(),blurb:blurb,groups:groups};
  });
  return out;
}
function _cleanSpeciesText(t){
  return (t||"").replace(/^\\(page|column|columnbreak)\s*$/gm,"").replace(/^\{\{pageNumber[^}]*\}\}\s*$/gm,"")
    .replace(/^#### .*$/gm,"").replace(/^\s*<!--[\s\S]*?-->\s*$/gm,"").replace(/[ \t]+$/gm,"").replace(/\n{3,}/g,"\n\n").trim();
}
function _parseSpeciesTraits(chunk){
  var lines=chunk.split("\n"),feats=[],cur=null;
  function flush(){
    if(!cur) return;
    var d=_cleanSpeciesText(cur.lines.join("\n"));
    // Cost written at the end of the paragraph: ***(1 point)***
    if(!cur.hasCost){
      var m=d.match(/\*{2,3}\(\s*(\d+)\s*points?\s*\)\*{2,3}/i);
      if(m){cur.cost=parseInt(m[1]);cur.hasCost=true;cur._own=cur.cost;d=d.replace(m[0],"").replace(/[ \t]+\n/g,"\n").trim();}
    }
    cur.desc=d;delete cur.lines;
    feats.push(cur);cur=null;
  }
  lines.forEach(function(line){
    var m=line.match(/^\*\*(.+?)\*\*\*?(?!\*)(.*)$/);
    var hdr=m?m[1]:"";
    // A trait line looks like "Name. *(N points)*" / "Name. (N Points)" / "Name."
    var tm=m&&hdr.match(/^([^.:*()]+?)[.:](?:\s+(.*))?$/);
    if(tm&&!/^\s*-/.test(line)){
      flush();
      var nm=tm[1].trim(),costTxt=tm[2]||"";
      cur={name:nm,desc:"",cost:0,hasCost:false,lines:[(m[2]||"").trim()]};
      if(costTxt){
        var nums=[],re=/(\d+)\s*points?/gi,mm;
        while((mm=re.exec(costTxt))) nums.push(parseInt(mm[1]));
        var rf=costTxt.match(/\(\s*([A-Za-z' ]+?)\s*\+\s*(\d+)\s*points?/i);
        if(rf){cur._ref=rf[1];cur._refAdd=parseInt(rf[2]);cur.hasCost=true;}
        else if(nums.length){cur.cost=nums.reduce(function(a,b){return a+b;},0);cur.hasCost=true;cur._own=cur.cost;}
      }
    } else if(cur){
      cur.lines.push(line);
    }
  });
  flush();
  return feats.filter(function(f){return !/^(Age|Subspecies|Heritage Trait)$/i.test(f.name);});
}

function useSpeciesCompendium(){
  const [tick,setTick]=React.useState(0);
  React.useEffect(function(){
    function onUpdate(){setTick(function(t){return t+1;});}
    _speciesListeners.push(onUpdate);
    if(_speciesCache.status==="idle"){
      _speciesCache.status="loading";_speciesCache.data={};
      fetch(SPECIES_MD_URL)
        .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
        .then(function(text){
          var md=parseSpeciesMd(text);_speciesCache.data=md;
          _speciesCache.status=Object.keys(md).length?"ready":"error";
        })
        .catch(function(){_speciesCache.status="error";})
        .finally(function(){_notifySpeciesListeners();});
    }
    return function(){var i=_speciesListeners.indexOf(onUpdate);if(i>=0)_speciesListeners.splice(i,1);};
  },[]);
  return _speciesCache;
}


// ─── Species filters (same + | ! syntax as the other compendiums) ─────────────
const SPECIES_FILTER_EMPTY={name:"",trait:"",desc:"",costMin:"",costMax:""};
function speciesFilterActive(f){return !!(f.name.trim()||f.trait.trim()||f.desc.trim()||(""+f.costMin).trim()||(""+f.costMax).trim());}
function speciesFeatFilterActive(f){return !!(f.trait.trim()||f.desc.trim()||(""+f.costMin).trim()||(""+f.costMax).trim());}
function filterSpecies(list,f){
  // A species is listed when at least one of its traits matches the trait / description / cost
  // filters; it is then shown with ALL of its traits (matching ones are flagged _hit).
  var cmin=parseFloat(f.costMin),cmax=parseFloat(f.costMax),ff=speciesFeatFilterActive(f),out=[];
  list.forEach(function(sp){
    if(f.name.trim()&&!matchQuery(sp.name+" "+sp.groups.map(function(g){return g.label;}).join(" "),f.name)) return;
    var any=false;
    var groups=sp.groups.map(function(g){
      return {label:g.label,feats:g.feats.map(function(ft){
        var hit=ff&&matchQuery(ft.name,f.trait)&&matchQuery(ft.desc,f.desc)&&(isNaN(cmin)||ft.cost>=cmin)&&(isNaN(cmax)||ft.cost<=cmax);
        if(hit) any=true;
        return Object.assign({},ft,{_hit:hit});
      })};
    });
    if(ff&&!any) return;
    out.push(Object.assign({},sp,{groups:groups,_filtered:ff}));
  });
  return out.sort(function(a,b){return a.name.localeCompare(b.name);});
}

    ["includeSrd",includeSrd,setIncludeSrd,true],

  ];
  const _KEEP_ON_CLEAR={pageSize:1,includeSrd:1};   // view prefs the Clear button keeps
  const _SIG_SKIP={page:1,dQuery:1,dDescQuery:1};    // excluded from the page-reset signature
  function _snap(){var o={};_FIELDS.forEach(function(f){o[f[0]]=f[1];});return o;}

  function _sigFrom(vals,k){var o={__k:k};_FIELDS.forEach(function(f){if(!_SIG_SKIP[f[0]])o[f[0]]=(vals&&(f[0] in vals))?vals[f[0]]:f[3];});return JSON.stringify(o);}
  const _sig=_sigFrom(_snap(),kind);

  // Clear just THIS list's filters/search (per-list, not global). Page resets via the signature effect.

  // SRD fetch (debounced) — only when there's a query
  React.useEffect(function(){
    if(!includeSrd){setSrdResults([]);return;}

    if(kind==="species"){setSrdResults([]);return;}
    var qq=(query||descQuery||"").trim();
    if(qq.length<2){setSrdResults([]);return;}
    if(debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current=setTimeout(function(){
      setSrdLoading(true);

  // Build the file-based list for the current kind
  var fileList=[];
  if(kind==="spells"&&spellCache.status==="ready"&&spellCache.data) fileList=Object.values(spellCache.data).map(function(x){return Object.assign({},x,{src:"file"});});
  else if(kind==="feats"&&featCache.status==="ready"&&featCache.data) fileList=Object.values(featCache.data).map(function(x){return Object.assign({},x,{src:"file"});});

      if(fAttune==="no"&&r.attune===true) return false;
      if(fType.trim()&&!matchQuery(r.type,fType)) return false;
      if(fAttuneTag.trim()&&!matchQuery(r.attuneTag,fAttuneTag)) return false;

  });

  results.sort(function(a,b){

  var PER_PAGE=pageSize;

  // Shared duplicate matcher for spells. Two spells are the same if all identity fields match

  function spellMatches(sp,candidate){

  function doAdd(r,clsName){

  return (

        onCollapse={function(){setExpanded(function(e){var n=Object.assign({},e);pageResults.forEach(function(r,idx){delete n[rowId(r,curPage*PER_PAGE+idx)];});return n;});}} />
      <div className="orn">Compendium</div>

        <span>Compendium Search</span>
        {(function(){
          var st=kind==="spells"?spellCache.status:kind==="feats"?featCache.status:kind==="exploits"?exploitCache.status:kind==="creatures"?creatureCache.status:kind==="species"?_speciesCache.status:itemCache.status;
          var col=st==="ready"?"rgba(74,156,92,.6)":st==="loading"?"rgba(201,150,42,.5)":"rgba(201,74,42,.5)";
          var lbl=st==="ready"?"Compendium file loaded":st==="loading"?"Loading compendium file…":"Compendium file unavailable (offline or missing)";
          return <span title={lbl} style={{display:"inline-flex",alignItems:"center",gap:4,fontFamily:"'Cinzel',serif",fontSize:8,letterSpacing:1,color:col,userSelect:"none",marginLeft:"auto",fontWeight:"normal",textTransform:"uppercase"}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:col,display:"inline-block",flexShrink:0}} />
            {kind==="spells"?"Spells":kind==="feats"?"Feats":kind==="exploits"?"Exploits":kind==="creatures"?"Creatures":kind==="species"?"Species":"Items"} File
          </span>;
        })()}
      </div>

        {creaturesEnabled
          ? tabBtn("creatures","Creatures")

              title="Reveal the monster compendium for this visit only. It hides again when you leave and re-enter the Compendium."
              style={{cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:"rgba(232,213,176,.3)",border:"1px dashed rgba(201,150,42,.22)",padding:"6px 12px",borderRadius:3,userSelect:"none"}}>

        </div>
        {showQueryHelp&&(
          <div style={{position:"absolute",top:"100%",right:0,marginTop:6,zIndex:300,width:"min(420px,92vw)",background:"#1a1410",border:"1px solid rgba(123,79,207,.4)",borderRadius:3,padding:"14px 16px",boxShadow:"0 6px 28px rgba(0,0,0,.6)"}}>
            <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:8}}>

              <div style={{marginTop:8,display:"grid",gridTemplateColumns:"auto 1fr",gap:"4px 12px",alignItems:"baseline"}}>

function Page4({c,s}){
  const ui=(k,i,f,v)=>s(k,prev=>{const a=[...prev];a[i]={...a[i],[f]:v};return a;});
  const di=(k,i)=>s(k,prev=>prev.filter((_,j)=>j!==i));
  const ai=(k,row)=>s(k,prev=>[...prev,row]);
  // Show/hide note bodies (markdown). Each list item carries a showDesc flag.
  const setAllDesc=(k,val)=>s(k,prev=>(prev||[]).map(it=>({...it,showDesc:val})));
  const toggleDesc=(k,i)=>s(k,prev=>(prev||[]).map((it,j)=>j===i?{...it,showDesc:it.showDesc===false}:it));
  const ecBtn={cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:9,color:"rgba(184,154,240,.5)",border:"1px solid rgba(184,154,240,.2)",padding:"0 6px",borderRadius:2,userSelect:"none",lineHeight:"15px"};
  const chevSt={cursor:"pointer",flexShrink:0,fontFamily:"'Cinzel',serif",fontSize:12,color:"rgba(184,154,240,.55)",userSelect:"none",alignSelf:"flex-start",paddingTop:6,width:12,textAlign:"center"};
  const descBtns=(k)=>((c[k]||[]).length>0?<span style={{display:"inline-flex",gap:3}}>
    <span onClick={()=>setAllDesc(k,true)} title="Expand all" style={ecBtn}>+</span>
    <span onClick={()=>setAllDesc(k,false)} title="Collapse all" style={ecBtn}>−</span>
  </span>:null);
  const mdPreview=(t)=>((t||"").replace(/[*_#>`~]/g," ").replace(/\s+/g," ").trim());
  const collapsedRow=(k,i,t)=><div onClick={()=>toggleDesc(k,i)} title="Show notes"
    style={{cursor:"pointer",color:"rgba(232,213,176,.3)",fontFamily:"'EB Garamond',serif",fontSize:13,fontStyle:"italic",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",padding:"4px 2px"}}>{mdPreview(t)||"(empty — click to add notes)"}</div>;
  const {useState:us}=React;
  const [sub,setSub]=us("npc");
  const [noteSearch,setNoteSearch]=us("");
  const nq=noteSearch.trim().toLowerCase();
  const fIdx=(arr)=>(arr||[]).map(function(it,i){return {it:it,i:i};}).filter(function(x){
    if(!nq) return true;
    try{return Object.keys(x.it).some(function(k){var v=x.it[k];return typeof v==="string"&&v.toLowerCase().indexOf(nq)>=0;});}catch(e){return true;}
  });
  // Custom user-defined sections — each {id, name, items:[{ti,tx,showDesc}]}
  const csList=c.customSections||[];
  const csUpd=(id,fn)=>s("customSections",(c.customSections||[]).map(cs=>cs.id===id?fn(cs):cs));
  const csItemUI=(id,i,f,v)=>csUpd(id,cs=>({...cs,items:cs.items.map((it,j)=>j===i?{...it,[f]:v}:it)}));
  const csItemDel=(id,i)=>csUpd(id,cs=>({...cs,items:cs.items.filter((_,j)=>j!==i)}));
  const csItemAdd=(id)=>csUpd(id,cs=>({...cs,items:[...(cs.items||[]),{ti:"",tx:""}]}));
  const csItemToggle=(id,i)=>csUpd(id,cs=>({...cs,items:cs.items.map((it,j)=>j===i?{...it,showDesc:it.showDesc===false}:it)}));
  const csSetAllDesc=(id,val)=>csUpd(id,cs=>({...cs,items:(cs.items||[]).map(it=>({...it,showDesc:val}))}));
  const csDelete=(id)=>{s("customSections",(c.customSections||[]).filter(cs=>cs.id!==id));setSub("npc");};
  const csAdd=()=>{var id=Date.now()+Math.random();s("customSections",[...(c.customSections||[]),{id:id,name:"New Section",items:[]}]);setSub("cs:"+id);};
  const subTabs=[
    {key:"npc",label:"NPCs",n:(c.npc||[]).length},
    {key:"locations",label:"Locations",n:(c.locations||[]).length},
    {key:"lore",label:"Lore",n:(c.lore||[]).length},
    {key:"factions",label:"Organisations",n:(c.factions||[]).length},
    {key:"nt1",label:"Session Notes",n:(c.nt1||[]).length},
    {key:"nt3",label:"Other Notes",n:(c.nt3||[]).length},
  ].concat(csList.map(function(cs){return {key:"cs:"+cs.id,label:cs.name||"Untitled",n:(cs.items||[]).length};}));
  // Expand/collapse every entry in the currently shown section (drives the far-left rail).
  const _curCs=sub.indexOf("cs:")===0?csList.find(function(x){return "cs:"+x.id===sub;}):null;
  const ecAll=function(val){ if(_curCs) csSetAllDesc(_curCs.id,val); else setAllDesc(sub,val); };
  const curCount=_curCs?(_curCs.items||[]).length:(c[sub]||[]).length;
  return (
    <div>
      <EcRail show={curCount>0} onExpand={function(){ecAll(true);}} onCollapse={function(){ecAll(false);}} />
      <div className="orn">Notes</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:34,marginTop:14}}>
        {subTabs.map(function(t){
          var active=sub===t.key;
          return <button key={t.key} onClick={function(){setSub(t.key);}}
            style={{fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:1.5,textTransform:"uppercase",padding:"7px 13px",cursor:"pointer",borderRadius:2,transition:"all .2s",display:"flex",alignItems:"center",gap:7,
              background:active?"linear-gradient(135deg,rgba(123,79,207,.3),rgba(201,150,42,.15))":"rgba(20,14,8,.8)",
              border:"1px solid "+(active?"var(--gold)":"rgba(201,150,42,.25)"),
              color:active?"var(--gold-l)":"#a08c5a"}}>
            {t.label}
            <span style={{fontFamily:"'Cinzel',serif",fontSize:9,minWidth:16,textAlign:"center",padding:"1px 5px",borderRadius:9,
              background:active?"rgba(201,150,42,.25)":"rgba(0,0,0,.35)",
              color:active?"var(--gold-l)":"rgba(232,213,176,.45)",
              border:"1px solid "+(active?"rgba(201,150,42,.4)":"rgba(201,150,42,.12)")}}>{t.n}</span>
          </button>;
        })}
        <button onClick={csAdd} title="Add a new custom section"
          style={{fontFamily:"'Cinzel',serif",fontSize:11,letterSpacing:1,textTransform:"uppercase",padding:"7px 12px",cursor:"pointer",borderRadius:2,transition:"all .2s",
            background:"transparent",border:"1px dashed rgba(123,79,207,.4)",color:"rgba(184,154,240,.7)"}}>+ Section</button>

// ─── DM Screen app ────────────────────────────────────────────────────────────
const {useState,useEffect,useRef}=React;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function d20(){return Math.floor(Math.random()*20)+1;}
const GOLD="#c9962a",GOLDL="#e8b84b",PARCH="#e8d5b0",ARC="#7b4fcf",ARCL="#b89af0",GRN="#4a9c5c",RED="#c94a2a";
const COMMON_CONDITIONS=["Blinded","Charmed","Concentration","Deafened","Frightened","Grappled","Incapacitated","Invisible","Paralyzed","Petrified","Poisoned","Prone","Restrained","Stunned","Unconscious"];
const DEFAULT_CATS=["NPCs","Locations","Sessions","Organizations","Plot Threads","Loot","Misc"];

const LS_KEY="dm_screen_v1";
function loadState(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};}}
function saveState(st){try{localStorage.setItem(LS_KEY,JSON.stringify(st));}catch(e){}}

const inp={background:"rgba(0,0,0,.3)",border:"1px solid rgba(201,150,42,.25)",color:PARCH,fontFamily:"'EB Garamond',serif",fontSize:13,outline:"none",padding:"5px 8px",borderRadius:2};
const btn=(col)=>({cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:1,textTransform:"uppercase",padding:"6px 12px",borderRadius:2,userSelect:"none",border:"1px solid rgba("+col+",.5)",color:"rgba("+col+",.95)",background:"rgba("+col+",.12)",whiteSpace:"nowrap"});
const lbl={fontFamily:"'Cinzel',serif",fontSize:9,letterSpacing:1,color:"rgba(232,213,176,.45)",textTransform:"uppercase"};

function entryToCombatant(entry){
  var cr=entry.creature||{};
  var dex=parseInt(cr.stats&&cr.stats.DEX)||10;
  var dexMod=Math.floor((dex-10)/2);
  var hp=parseInt(cr.hpMax)||10;
  var ac=parseInt(cr.acFlat)||10;
  return {id:uid(),name:entry.name,type:"creature",init:null,dexMod:dexMod,hp:hp,maxHp:hp,ac:ac,conditions:[],spells:[],statblockMd:entry.desc||"",images:entry.images||[],creature:entry.creature||null,expanded:false};
}

// ─── Dice rolling ─────────────────────────────────────────────────────────────
function rollN(s){return Math.floor(Math.random()*s)+1;}
function fmtMod(m){return m>=0?"+"+m:""+m;}
function abMod(score){return Math.floor((parseInt(score)-10)/2);}
const ABLS6=["STR","DEX","CON","INT","WIS","CHA"];
const SKILL_ABILITY={"Acrobatics":"DEX","Animal Handling":"WIS","Arcana":"INT","Athletics":"STR","Deception":"CHA","History":"INT","Insight":"WIS","Intimidation":"CHA","Investigation":"INT","Medicine":"WIS","Nature":"INT","Perception":"WIS","Performance":"CHA","Persuasion":"CHA","Religion":"INT","Sleight of Hand":"DEX","Stealth":"DEX","Survival":"WIS"};
// Pull every damage dice expression (and its type) out of an attack's text, so
// multi-part and conditional damage (e.g. "1d4+2 ... or 3d4+2", "1d6+2 plus 1d4")
// each become their own rollable entry.
function extractDamages(text){
  text=""+(text||"");
  var out=[],m,re=/(\d+)d(\d+)(\s*[+-]\s*\d+)?/g;
  while((m=re.exec(text))){
    var after=text.slice(m.index+m[0].length, m.index+m[0].length+40);
    var ty=after.match(/[)\s]*([A-Za-z]+)\s+damage/i);
    out.push({n:+m[1],sides:+m[2],bonus:m[3]?parseInt(m[3].replace(/\s+/g,"")):0,dtype:ty?ty[1].toLowerCase():""});
  }
  return out;
}
// Fallback: derive rollables straight from the saved display statblock markdown
// (used for combatants added before the structured creature object was stored).
function statblockRolls(md){
  md=""+(md||""); var groups=[];
  var abl=[],sav=[];
  ABLS6.forEach(function(a){
    var m=md.match(new RegExp("\\*\\*"+a+"\\*\\*\\s*\\d+\\s*\\|\\s*([+-]?\\d+)\\s*\\|\\s*([+-]?\\d+)","i"));
    if(m){abl.push({label:a,type:"d20",mod:parseInt(m[1])});sav.push({label:a+" save",type:"d20",mod:parseInt(m[2])});}
  });
  if(abl.length){groups.push({g:"Ability Checks",items:abl});groups.push({g:"Saving Throws",items:sav});}
  var sk=md.match(/\*\*Skills\*\*\s*([^\n]+)/i);
  if(sk){var items=[],re=/([A-Za-z][A-Za-z ]*?)\s*([+-]\d+)/g,m;while((m=re.exec(sk[1])))items.push({label:m[1].trim(),type:"d20",mod:parseInt(m[2])});if(items.length)groups.push({g:"Skills",items:items});}
  var atk=[],dmg=[],re2=/\*\*\*\s*([^*]+?)\s*\*\*\*\s*([\s\S]*?)(?=\*\*\*|###|$)/g,mm;
  while((mm=re2.exec(md))){
    var nm=mm[1].replace(/\.\s*$/,"").trim(),body=mm[2];
    var hm=body.match(/Attack Roll:?\s*([+-]\s*\d+)/i)||body.match(/([+-]\s*\d+)\s*to hit/i);
    if(hm)atk.push({label:nm,type:"d20",mod:parseInt(hm[1].replace(/\s+/g,""))});
    extractDamages(body).forEach(function(d){dmg.push({label:nm+(d.dtype?" ("+d.dtype+")":""),type:"dice",n:d.n,sides:d.sides,bonus:d.bonus});});
  }
  if(atk.length)groups.push({g:"Attacks",items:atk});
  if(dmg.length)groups.push({g:"Damage",items:dmg});
  return groups;
}
// Build every rollable thing for a combatant from its parsed statblock.
// Everything a player can roll, built from the imported character sheet.
function psRolls(c){
  var d=psDerive(c.sheet);
  var groups=[{g:"General",items:[{label:"Initiative",type:"d20",mod:(c.dexMod||0),isInit:true},{label:"d20",type:"d20",mod:0},{label:"Death save",type:"d20",mod:0}]}];
  groups.push({g:"Ability Checks",items:d.checks.map(function(x){return {label:x.a,type:"d20",mod:x.v};})});
  groups.push({g:"Saving Throws",items:d.saves.map(function(x){return {label:x.a+" save",type:"d20",mod:x.v};})});
  groups.push({g:"Skills",items:d.skills.map(function(x){return {label:x.n,type:"d20",mod:x.v};})});
  var atk=[],dmg=[];
  d.weapons.forEach(function(w){
    if(!w.nm&&!w.roll.length)return;
    if(!w.isSave&&w.atk!=null)atk.push({label:w.nm||"Attack",type:"d20",mod:w.atk});
    w.roll.forEach(function(p){
      var dice=(""+p.dice).replace(/[^0-9dD+\-]/g,"");
      var expr=(dice?dice:"")+(p.bonus?(p.bonus>0?"+":"")+p.bonus:"");
      if(expr[0]==="+")expr=expr.slice(1);
      if(!expr||!rollExpression(expr))return;
      dmg.push({label:(w.nm||"Attack")+(p.type?" ("+p.type+")":""),type:"expr",expr:expr});
    });
  });
  d.casters.forEach(function(x){atk.push({label:(x.nm||"Spell")+" spell attack",type:"d20",mod:x.atk});});
  if(atk.length)groups.push({g:"Attacks",items:atk});
  if(dmg.length)groups.push({g:"Damage",items:dmg});
  return groups;
}
function creatureRolls(c){
  if(c.sheet)return psRolls(c);
  var groups=[{g:"General",items:[{label:"Initiative",type:"d20",mod:(c.dexMod||0),isInit:true},{label:"d20",type:"d20",mod:0}]}];
  var cr=c.creature;
  if(cr&&cr.stats){
    var pb=parseInt(cr.pbFlat)||2, st=cr.stats;
    groups.push({g:"Ability Checks",items:ABLS6.map(function(a){return {label:a,type:"d20",mod:abMod(st[a])};})});
    var sp=cr.saveProficiencies||{};
    groups.push({g:"Saving Throws",items:ABLS6.map(function(a){return {label:a+" save",type:"d20",mod:abMod(st[a])+(sp[a]?pb:0)};})});
    var sk=cr.skillProficiencies||{};
    var skItems=Object.keys(sk).map(function(n){var ab=SKILL_ABILITY[n]||"DEX";return {label:n,type:"d20",mod:abMod(st[ab])+pb};});
    if(skItems.length) groups.push({g:"Skills",items:skItems});
    var atk=[],dmg=[];
    ["actions","bonusActions","reactions"].forEach(function(k){(cr[k]||[]).forEach(function(act){
      var desc=act.description||"";
      var atkB=act.atkFormula?parseInt(act.atkFormula.flat):NaN;
      if(isNaN(atkB)){var hm=desc.match(/Attack Roll:?\s*([+-]\s*\d+)/i)||desc.match(/([+-]\s*\d+)\s*to hit/i);if(hm)atkB=parseInt(hm[1].replace(/\s+/g,""));}
      if(!isNaN(atkB)) atk.push({label:act.nm,type:"d20",mod:atkB});
      var ds=extractDamages(desc);
      if(!ds.length&&act.dmgDice){var mm=(""+act.dmgDice).match(/(\d+)d(\d+)/);if(mm)ds=[{n:+mm[1],sides:+mm[2],bonus:act.dmgFormula?(parseInt(act.dmgFormula.flat)||0):0,dtype:act.dmgType||""}];}
      ds.forEach(function(d){dmg.push({label:act.nm+(d.dtype?" ("+d.dtype+")":""),type:"dice",n:d.n,sides:d.sides,bonus:d.bonus});});
    });});
    if(atk.length) groups.push({g:"Attacks",items:atk});
    if(dmg.length) groups.push({g:"Damage",items:dmg});
  } else if(c.statblockMd){
    groups=groups.concat(statblockRolls(c.statblockMd));
  }
  return groups;
}
function rollItem(it){
  if(it.type==="expr"){var er=rollExpression(it.expr);return er||{total:0,detail:"?"};}
  if(it.type==="dice"){var rs=[],t=0;for(var i=0;i<it.n;i++){var x=rollN(it.sides);rs.push(x);t+=x;}return {total:t+(it.bonus||0),detail:it.n+"d"+it.sides+"["+rs.join(",")+"]"+(it.bonus?fmtMod(it.bonus):"")};}
  var d=rollN(20);return {total:d+(it.mod||0),detail:"d20("+d+")"+(it.mod?fmtMod(it.mod):"")};
}
// Parse & roll a free-form expression like "2d6 + 1d8 + 3 - 1d4" (or "d20+5").
function rollExpression(expr){
  var s=(""+(expr||"")).replace(/\s+/g,"");
  if(!s) return null;
  var terms=s.match(/[+-]?[^+-]+/g);
  if(!terms) return null;
  var total=0, parts=[];
  for(var i=0;i<terms.length;i++){
    var sign=1, t=terms[i];
    if(t[0]==="+"){t=t.slice(1);} else if(t[0]==="-"){sign=-1;t=t.slice(1);}
    var dm=t.match(/^(\d*)d(\d+)$/i);
    if(dm){
      var n=parseInt(dm[1]||"1"), sides=parseInt(dm[2]);
      if(!sides||n<1||n>500) return null;
      var rs=[],sub=0;
      for(var j=0;j<n;j++){var x=rollN(sides);rs.push(x);sub+=x;}
      total+=sign*sub;
      parts.push((sign<0?"−":(parts.length?"+":""))+n+"d"+sides+"["+rs.join(",")+"]");
    } else if(/^\d+$/.test(t)){
      total+=sign*parseInt(t);
      parts.push((sign<0?"−":(parts.length?"+":""))+t);
    } else { return null; }
  }
  return {total:total, detail:parts.join("")};
}

// Damage uses up temporary HP first; healing never touches it.
function hpChange(p,delta){
  var hp=p.hp||0,tmp=p.tempHp||0;
  if(delta<0){var take=Math.min(tmp,-delta);tmp-=take;hp=Math.max(0,hp-(-delta-take));}
  else hp=Math.min(p.maxHp||9999,hp+delta);
  return {hp:hp,tempHp:tmp};
}
// Death saves. Players: read from their imported sheet. Creatures: counted here when the ☠ box is ticked.
function psDeathState(c){
  var ok,bad,dead;
  if(c.sheet){
    var sh=c.sheet;
    ok=(sh.ds||[]).filter(Boolean).length;bad=(sh.df||[]).filter(Boolean).length;
    dead=bad>=3||(parseInt(sh.exhaustion)||0)>=6;
  } else {
    if(!c.deathSaves)return {ok:0,bad:0,dead:false,stable:false};
    ok=c.dsOk||0;bad=c.dsBad||0;dead=bad>=3;
  }
  return {ok:ok,bad:bad,dead:dead,stable:!dead&&ok>=3&&(c.hp||0)<=0};
}
// One automatic death save for a creature at the start of its turn (1 = two failures, 2-9 fail, 10-19 success, 20 = back up with 1 HP).
function dsRollStep(c){
  if(!c||c.type==="pc"||!c.deathSaves||(c.hp||0)>0)return null;
  var ok=c.dsOk||0,bad=c.dsBad||0;
  if(bad>=3||ok>=3)return null;
  var r=rollN(20),note,patch;
  if(r===20){patch={hp:1,dsOk:0,dsBad:0};note="natural 20, regains 1 HP";}
  else if(r===1){bad=Math.min(3,bad+2);patch={dsBad:bad};note="natural 1, two failures";}
  else if(r<10){bad=Math.min(3,bad+1);patch={dsBad:bad};note="failure";}
  else{ok=Math.min(3,ok+1);patch={dsOk:ok};note="success";}
  var end=patch.dsBad>=3?" - DEAD":patch.dsOk>=3?" - STABLE":"";
  return {patch:patch,log:{id:uid(),name:c.name,label:"Death save",detail:"d20("+r+") "+note+end,total:r}};
}

  return <span style={{display:"inline-flex",alignItems:"center",gap:6}}><span title="Successes">{dot(ok,"#7cc98a","●","ok")}</span><span title="Failures">{dot(bad,"#e07060","✕","bad")}</span></span>;
}

// ─── Player sheet import (reads the Character Sheet's saved .json) ───────────
// The helpers inside PS are copied unchanged from character_sheet.html so every
// number shown here is worked out the same way the sheet works it out.
const PS=(function(){
const getTotal=(c,st)=>(parseInt(c.statsBase&&c.statsBase[st]||0)||0)+(parseInt(c.statsBon&&c.statsBon[st]||0)||0);
const getMod=(c,st)=>Math.floor((getTotal(c,st)-10)/2);
function _clsMatch(a,b){
  var na=(""+(a||"")).toLowerCase().replace(/[^a-z0-9]/g,"");
  var nb=(""+(b||"")).toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!na||!nb) return false;
  return na===nb||na.indexOf(nb)===0||nb.indexOf(na)===0;
}
function computeBonusFromFormula(formula,c){
  if(!formula) return 0;
  const allCls=(c.classes&&c.classes.length>0?c.classes:[{nm:c.cls||"",lv:"",hd:"d6"}]).filter(function(cl){return (cl.nm||"").trim();});
  const totalLv=allCls.reduce(function(t,cl){return t+(parseInt(cl.lv)||0);},0);
  const pb2=(function(){var base=totalLv<1?2:Math.ceil(totalLv/4)+1;return base+(parseInt((c.pbBonus||"").replace("+",""))||0);})();
  const getMod2=function(abl){var base=parseInt((c.statsBase&&c.statsBase[abl])||c.stats[abl])||10;var bon=parseInt((c.statsBon&&c.statsBon[abl])||0)||0;return Math.floor((base+bon-10)/2);};
  const flat=parseInt((formula.flat||"").replace("+",""))||0;
  const ablSum=(formula.abls||[]).reduce(function(t,a){return t+getMod2(a);},0);

  // Prof: new array format (profs:[]) stacks freely; fall back to old single field
  var profSum=0;
  if(formula.profs&&formula.profs.length>0){
    profSum=(formula.profs||[]).reduce(function(t,p){
      return t+(p==="full"?pb2:p==="half-up"?Math.ceil(pb2/2):p==="half"?Math.floor(pb2/2):0);
    },0);
  } else {
    profSum=formula.prof==="full"?pb2:formula.prof==="half"?Math.floor(pb2/2):formula.prof==="half-up"?Math.ceil(pb2/2):0;
  }

  // Level: new array format (lvlEntries:[{type,cls}]) stacks freely; fall back to old single fields
  var lvlSum=0;
  if(formula.lvlEntries&&formula.lvlEntries.length>0){
    lvlSum=(formula.lvlEntries||[]).reduce(function(t,e){
      var type=e.type||"none";
      if(type==="total-full") return t+totalLv;
      if(type==="total-half-down") return t+Math.floor(totalLv/2);
      if(type==="total-half-up") return t+Math.ceil(totalLv/2);
      var cl=allCls.find(function(x){return _clsMatch(x.nm,e.cls);});
      var clLv=cl?parseInt(cl.lv)||0:0;
      if(type==="class-full") return t+clLv;
      if(type==="class-half-down") return t+Math.floor(clLv/2);
      if(type==="class-half-up") return t+Math.ceil(clLv/2);
      return t;
    },0);
  } else {
    // backward compat
    if(formula.lvlType==="total-full") lvlSum=totalLv;
    else if(formula.lvlType==="total-half-down") lvlSum=Math.floor(totalLv/2);
    else if(formula.lvlType==="total-half-up") lvlSum=Math.ceil(totalLv/2);
    else if(formula.lvlType==="class-full"){var cl=allCls.find(function(x){return _clsMatch(x.nm,formula.lvlClass);});lvlSum=cl?parseInt(cl.lv)||0:0;}
    else if(formula.lvlType==="class-half-down"){var cl2=allCls.find(function(x){return _clsMatch(x.nm,formula.lvlClass);});lvlSum=cl2?Math.floor((parseInt(cl2.lv)||0)/2):0;}
    else if(formula.lvlType==="class-half-up"){var cl3=allCls.find(function(x){return _clsMatch(x.nm,formula.lvlClass);});lvlSum=cl3?Math.ceil((parseInt(cl3.lv)||0)/2):0;}
  }

  return flat+ablSum+profSum+lvlSum;
}
function getCharDCSources(c){
  if(!c) return [];
  const out=[];
  const allCls=(c.classes&&c.classes.length>0?c.classes:[{nm:c.cls||"",lv:"",hd:"d6"}]).filter(function(cl){return (cl.nm||"").trim()||(cl.dcs&&cl.dcs.length);});
  const totalLv=allCls.reduce(function(t,cl){return t+(parseInt(cl.lv)||0);},0);
  const pb=(totalLv<1?2:Math.ceil(totalLv/4)+1)+(parseInt((c.pbBonus||"").replace("+",""))||0);
  const mod=function(abl){var base=parseInt((c.statsBase&&c.statsBase[abl])||(c.stats&&c.stats[abl]))||10;var bon=parseInt((c.statsBon&&c.statsBon[abl])||0)||0;return Math.floor((base+bon-10)/2);};
  const exhPen=Math.min(5,Math.max(0,parseInt(c.exhaustion)||0))*-2;
  // Page-1 per-class Save DCs
  (c.classes||[]).forEach(function(cl,ci){
    (cl.dcs||[]).forEach(function(dc,di){
      var abl=dc.abl||"INT";
      var bon=dc.bonusFormula?computeBonusFromFormula(dc.bonusFormula,c):(parseInt((dc.bonus||"").replace("+",""))||0);
      var pen=(dc.isSpell?(c.exhAffectAllDC||c.exhAffectSpellDC):c.exhAffectAllDC)?exhPen:0;
      out.push({key:"class:"+ci+":"+di,label:(dc.nm||((cl.nm||"Class")+" DC"))+" ("+abl+")",abl:abl,value:8+pb+mod(abl)+bon+pen});
    });
  });
  // Spellcasting classes
  (c.spellClasses||[]).forEach(function(sc,i){
    var abl=sc.abl||"INT";
    var bon=sc.dcBonusFormula?computeBonusFromFormula(sc.dcBonusFormula,c):(parseInt((sc.dcBonus||"").replace("+",""))||0);
    var pen=(c.exhAffectAllDC||c.exhAffectSpellDC)?exhPen:0;
    out.push({key:"spell:"+i,label:(sc.nm||("Spellcasting "+(i+1)))+" DC ("+abl+")",abl:abl,value:8+pb+mod(abl)+bon+pen});
  });
  // Exploit classes
  (c.exploitClasses||[]).forEach(function(ec,i){
    var abl=ec.abl||"STR";
    var bon=ec.dcBonusFormula?computeBonusFromFormula(ec.dcBonusFormula,c):(parseInt((ec.dcBonus||"").replace("+",""))||0);
    var pen=c.exhAffectAllDC?exhPen:0;
    out.push({key:"exploit:"+i,label:(ec.nm||("Exploit "+(i+1)))+" DC ("+abl+")",abl:abl,value:8+pb+mod(abl)+bon+pen});
  });
  return out;
}
function computeCarriedWeight(c){
  if(!c) return 0;
  var coins=function(cur){var r=cur||{};return (parseFloat(r.cp)||0)+(parseFloat(r.sp)||0)+(parseFloat(r.ep)||0)+(parseFloat(r.gp)||0)+(parseFloat(r.pp)||0);};
  var itemWeight=function(it){return it.wl?0:(parseFloat(it.wt)||0)*(it.qt===''||it.qt===undefined||it.qt===null?1:(parseFloat(it.qt)||0));};
  var sumItems=function(arr){return (arr||[]).reduce(function(s,it){return s+itemWeight(it);},0);};
  var invW=sumItems(c.inv);
  var attW=sumItems(c.attuned_inv);
  var coinW=coins(c.cur)*0.02; // main pouch coins only
  var bags=c.bags||[];
  var bagSelf=bags.reduce(function(t,b){return t+(b&&b.selfWeight!=null?(parseFloat(b.selfWeight)||0):5);},0);
  var bagContents=bags.reduce(function(t,b){
    var weightlessInside=b?b.weightless!==false:true;
    if(weightlessInside) return t;
    return t+sumItems(b.inv)+coins(b.cur)*0.02;
  },0);
  return invW+attW+coinW+bagSelf+bagContents;
}

// Single source of truth for everything encumbrance-related, so the Speed penalty
// (Page1) and the encumbrance bar (Page2) are guaranteed to stay in sync. Returns
// the carried weight, the three thresholds, the speed penalty (in feet, or the
// "overcap" sentinel), and the status label/color. Capacity uses total STR
// (incl. bonuses), the flat carry bonus, and the carry multiplier.
function computeEncumbrance(c){
  c=c||{};
  var str=getTotal(c,"STR")||10;
  var carryFlat=parseFloat(c.carryBonus||0)||0;
  var carryMult=parseFloat(c.carryMult||1)||1;
  var thresh=function(n){return (str*n+carryFlat)*carryMult;};
  var enc1=thresh(5);    // encumbered
  var enc2=thresh(10);   // heavily encumbered
  var capacity=thresh(15); // max carry
  var weight=computeCarriedWeight(c);
  var penalty=weight>capacity?"overcap":(weight>=enc2?-20:(weight>=enc1?-10:0));
  var level=weight<enc1?0:(weight<enc2?1:(weight<=capacity?2:3)); // 0 none,1 enc,2 heavy,3 over
  var color=["#4a9c5c","#c9962a","#e07030","#c94a2a"][level];
  var label=["Unencumbered",
             "Encumbered (-10 ft speed)",
             "Heavily Encumbered (-20 ft speed, disadv. STR/DEX/CON checks)",
             "Over Capacity (speed 5 ft, disadv. STR/DEX/CON checks, cannot jump)"][level];
  return {weight:weight,enc1:enc1,enc2:enc2,capacity:capacity,penalty:penalty,level:level,color:color,label:label};
}

return {getTotal:getTotal,getMod:getMod,computeBonusFromFormula:computeBonusFromFormula,getCharDCSources:getCharDCSources,computeEncumbrance:computeEncumbrance};
})();
const PS_ABL=["STR","DEX","CON","INT","WIS","CHA"];
const PS_SKILLS=[["Acrobatics","DEX"],["Animal Handling","WIS"],["Arcana","INT"],["Athletics","STR"],["Deception","CHA"],["History","INT"],["Insight","WIS"],["Intimidation","CHA"],["Investigation","INT"],["Medicine","WIS"],["Nature","INT"],["Perception","WIS"],["Performance","CHA"],["Persuasion","CHA"],["Religion","INT"],["Sleight of Hand","DEX"],["Stealth","DEX"],["Survival","WIS"]];
const PS_DROP={portrait:1,savedRolls:1,taH:1,dsOpen:1,secOpen:1,creatures:1,nt1:1,nt2:1,nt3:1,npc:1,locations:1,lore:1,customSections:1,factions:1};
const psN=function(v){return parseInt((""+(v==null?"":v)).replace("+",""))||0;};
const psF=function(n){return n>=0?"+"+n:""+n;};

// Copy of the sheet minus UI state, journals and the (large) portrait.
function psSnapshot(raw){
  var o={};
  Object.keys(raw||{}).forEach(function(k){if(!PS_DROP[k])o[k]=raw[k];});
  o.statsBase=Object.assign({},o.statsBase||{});
  PS_ABL.forEach(function(a){if(o.statsBase[a]===""||o.statsBase[a]==null){var v=o.stats&&o.stats[a];if(v!==""&&v!=null)o.statsBase[a]=v;}});
  return o;
}
function psThumb(src,ax,ay,sc){ax=+ax||0;ay=+ay||0;sc=+sc||1;
  return new Promise(function(res){
    if(!src||typeof src!=="string"){res("");return;}
    var im=new Image();
    im.onload=function(){try{var s=96,cv=document.createElement("canvas");cv.width=s;cv.height=s;var cx=cv.getContext("2d");var k=s/84;cx.fillStyle='#000';cx.fillRect(0,0,s,s);cx.translate(s/2+ax*k,s/2+ay*k);cx.scale(sc*k,sc*k);cx.drawImage(im,-im.width/2,-im.height/2);res(cv.toDataURL("image/jpeg",.8));}catch(e){res("");}};
    im.onerror=function(){res("");};
    im.src=src;
  });
}

// All the numbers the panel shows, worked out like the sheet does.
function psDerive(c){
  var cls=(c.classes&&c.classes.length>0?c.classes:[{nm:c.cls||"",lv:"",hd:"d6"}]);
  var level=cls.reduce(function(t,cl){return t+(parseInt(cl.lv)||0);},0);
  var pb=(level<1?2:Math.ceil(level/4)+1)+psN(c.pbBonus);
  var mod=function(a){return PS.getMod(c,a);};
  var exh=Math.min(6,Math.max(0,parseInt(c.exhaustion)||0));
  var exhPen=Math.min(5,exh)*-2, exhSpd=Math.min(5,exh)*-5;
  var cf=function(f){return PS.computeBonusFromFormula(f,c);};
  var abilChk=c.abilCheckBonusFormula?cf(c.abilCheckBonusFormula):psN(c.abilCheckBonus);
  var abilChkAbl=function(a){var f=(c.abilCheckBonusPerAblFormula||{})[a];return f?cf(f):psN((c.abilCheckBonusPerAbl||{})[a]);};
  var skBon=c.skBonusFormula?cf(c.skBonusFormula):psN(c.skBonus);
  var svBon=c.svBonusFormula?cf(c.svBonusFormula):psN(c.svBonus);
  var skAbil=function(n,a){return c.skAbil&&c.skAbil[n]?c.skAbil[n]:a;};
  var hasProfF=function(f){return !!(f&&((f.profs&&f.profs.length>0)||(f.prof&&f.prof!=="none")));};
  var anyProf=function(n,a){return !!((c.skp&&c.skp[n])||hasProfF(c.skBonusFormula)||hasProfF(c.skExtraFormula&&c.skExtraFormula[n])||hasProfF(c.abilCheckBonusFormula)||hasProfF((c.abilCheckBonusPerAblFormula||{})[a]));};
  var skill=function(n,a0){
    var a=skAbil(n,a0),b=mod(a),prof=!!(c.skp&&c.skp[n]),exp=prof&&!!(c.skExp&&c.skExp[n]);
    var own=exp?pb*2:prof?pb:0;
    var ex=c.skExtraFormula&&c.skExtraFormula[n]?cf(c.skExtraFormula[n]):psN((c.skExtra||{})[n]);
    var half=((c.halfProfSkills||c.halfProfChecks)&&!anyProf(n,a))?Math.floor(pb/2):0;
    return {n:n,a:a,prof:prof,exp:exp,v:b+own+skBon+ex+abilChk+abilChkAbl(a)+half+exhPen};
  };
  var skills=PS_SKILLS.map(function(s){return skill(s[0],s[1]);});
  var checks=PS_ABL.map(function(a){return {a:a,v:mod(a)+abilChk+abilChkAbl(a)+exhPen};});
  var byName=function(n){for(var i=0;i<skills.length;i++)if(skills[i].n===n)return skills[i];return {v:0};};
  var saves=PS_ABL.map(function(a){
    var ex=c.svExtraFormula&&c.svExtraFormula[a]?cf(c.svExtraFormula[a]):psN((c.svExtra||{})[a]);
    return {a:a,prof:!!(c.svp&&c.svp[a]),v:mod(a)+((c.svp&&c.svp[a])?pb:0)+svBon+ex+exhPen};
  });
  // armor class
  var acMap=c.acAbls&&!Array.isArray(c.acAbls)?c.acAbls:{};
  var acAbl=Object.keys(acMap).filter(function(k){return acMap[k]&&acMap[k].on;}).reduce(function(t,k){var raw=mod(k);var cap=parseInt(acMap[k].cap||"")||null;return t+(cap!==null?Math.min(raw,cap):raw);},0);
  var ac=(parseInt(c.acBase||0)||0)+acAbl+(c.acBonFormula?cf(c.acBonFormula):(parseInt(c.acBon||0)||0));
  var enc=PS.computeEncumbrance(c);
  var speed=enc.penalty==="overcap"?Math.max(0,5+exhSpd):Math.max(0,(parseInt(c.spdBase||30)||30)+(parseInt(c.spdBon||0)||0)+exhSpd+enc.penalty);
  // initiative
  var f=c.iniFormula, init;
  if(f){init=cf(Object.assign({},f,{abls:f.abls||["DEX"]}));}else{init=mod("DEX");}
  init+=abilChk+abilChkAbl("DEX")+exhPen;

// Reads one or more sheet .json files and turns each into a player combatant.
function psReadFiles(files,onAdd,setErr){
  var list=Array.prototype.slice.call(files||[]),bad=[];
  var next=function(){
    var f=list.shift();
    if(!f){setErr(bad.length?"Couldn't read: "+bad.join(", ")+" (not a character sheet save).":"");return;}
    var r=new FileReader();
    r.onload=function(){
      var raw=null;try{raw=JSON.parse(r.result);}catch(e){}
      if(!raw||typeof raw!=="object"||Array.isArray(raw)||(!raw.stats&&!raw.statsBase&&!raw.classes)){bad.push(f.name);next();return;}
      var snap=psSnapshot(raw),dd=psDerive(snap);
      psThumb(raw.portrait,raw.avX,raw.avY,raw.avScale).then(function(th){
        snap._thumb=th;
        onAdd({id:uid(),name:(snap.name||"").trim()||f.name.replace(/\.json$/i,""),type:"pc",init:null,dexMod:dd.init,hp:Math.min(dd.hpCur,dd.hpMax||dd.hpCur),maxHp:dd.hpMax,tempHp:dd.hpTemp,ac:dd.ac,conditions:[],spells:[],statblockMd:"",images:[],expanded:false,sheet:snap});
        next();
      });
    };
    r.onerror=function(){bad.push(f.name);next();};
    r.readAsText(f);
  };
  next();
}

// ─── Live sync (players' sheets arrive through a shared Firebase Realtime Database) ───
const SYNC_KEY="dm_sync_v1";
function syncLoad(){var d={url:"",room:"",on:false};try{return Object.assign(d,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"));}catch(e){return d;}}
function syncBase(c){return c.url.replace(/\/+$/,"")+"/rooms/"+encodeURIComponent((c.room||"").trim());}
function syncParse(text){var raw=JSON.parse(text);var th=raw.__thumb;delete raw.__thumb;var snap=psSnapshot(raw);snap._thumb=th||"";return snap;}
function psNewCombatant(snap,name,syncId,updated){
  var dd=psDerive(snap);
  return {id:uid(),name:name,type:"pc",init:null,dexMod:dd.init,hp:Math.min(dd.hpCur,dd.hpMax||dd.hpCur),maxHp:dd.hpMax,tempHp:dd.hpTemp,ac:dd.ac,conditions:[],spells:[],statblockMd:"",images:[],expanded:false,sheet:snap,syncId:syncId,syncUpdated:updated};
}
// A new copy of a player's sheet: replace the sheet, and only move the combat numbers the PLAYER changed
// (so a hit the DM just applied isn't undone by an old value).
function psSyncPatch(c,snap,updated){
  var prev=psDerive(c.sheet||snap),now=psDerive(snap);
  var p={sheet:snap,syncUpdated:updated};
  if(prev.hpMax!==now.hpMax)p.maxHp=now.hpMax;
  if(prev.hpCur!==now.hpCur)p.hp=Math.min(now.hpCur,(p.maxHp!=null?p.maxHp:c.maxHp)||9999);
  if(prev.hpTemp!==now.hpTemp)p.tempHp=now.hpTemp;
  if(prev.ac!==now.ac)p.ac=now.ac;
  if(prev.init!==now.init)p.dexMod=now.init;
  return p;
}
// Every read carries a unique value so no cache along the way can hand back an older copy; if the database refuses it, ask again plainly.
async function syncGet(url){
  try{var r=await fetch(url+(url.indexOf("?")<0?"?":"&")+"_="+Date.now()+Math.floor(Math.random()*1000),{cache:"no-store"});if(r.ok)return r;}catch(e){}
  return fetch(url,{cache:"no-store"});
}

function ToolFrame({tool,active}){
  const [html,setHtml]=useState(null);

  const load=function(){
    setErr("");setHtml(null);
    var key="dm_tool_"+tool.file;
    fetch(DM_TOOLS_BASE+tool.file,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
      .then(function(t){setHtml(t);try{localStorage.setItem(key,t);}catch(e){}})
      .catch(function(e){var c=null;try{c=localStorage.getItem(key);}catch(x){}if(c){setHtml(c);}else setErr("Could not load "+tool.file+" from the repo ("+e.message+"). Check that dm/"+tool.file+" is uploaded.");});
  };

function App(){

  window.__dmPcs=pcKey;

  },[pcKey]);
  useEffect(function(){
    var h=function(e){

      var fr=document.querySelectorAll("iframe[data-dmtool]");
      for(var i=0;i<fr.length;i++){if(fr[i].contentWindow===e.source)dmPostParty(fr[i]);}
    };
    window.addEventListener("message",h);
    return function(){window.removeEventListener("message",h);};
  },[]);
  const [confirmState,setConfirmState]=useState({open:false,message:"",onConfirm:null});

  const toggleTheme=function(){setTheme(function(t){return t==="light"?"dark":"light";});};
  const [saveMsg,setSaveMsg]=useState("");
  const flashSave=function(m){setSaveMsg(m);setTimeout(function(){setSaveMsg("");},2600);};

  const flashAdd=function(name){setAddMsg({name:name,id:Date.now()+Math.random()});if(addTimer.current)clearTimeout(addTimer.current);addTimer.current=setTimeout(function(){setAddMsg(null);},1600);};
  const loaded=useRef(false);
  const notesS=function(k,v){setNotes(function(prev){var nv=typeof v==="function"?v(prev[k]):v;return Object.assign({},prev,{[k]:nv});});};
  useEffect(function(){
    window.__confirm=function(message,onConfirm,confirmLabel){setConfirmState({open:true,message:message,onConfirm:onConfirm,confirmLabel:confirmLabel});};
    var s=loadState();
    if(s.combat)setCombat(s.combat);
    var n=(s.notes&&typeof s.notes==="object")?s.notes:null;
    if(!n){
      n={npc:[],locations:[],lore:[],factions:[],nt1:[],nt3:[],customSections:[]};
      if(s.codex&&s.codex.cats){n.customSections=s.codex.cats.map(function(cat){return {id:cat.id||(Date.now()+Math.random()),name:cat.name||"Section",items:(cat.entries||[]).map(function(e){return {ti:e.ti||e.title||"",tx:e.tx||e.body||"",showDesc:e.open!==false};})};});}
      else if(typeof s.notes==="string"&&s.notes.trim()){n.nt1=[{ti:"Imported notes",tx:s.notes}];}
    }
    NOTE_KEYS.forEach(function(k){if(!Array.isArray(n[k]))n[k]=[];});
    setNotes(n);loaded.current=true;
  },[]);
  useEffect(function(){if(loaded.current)saveState({notes:notes,combat:combat});},[notes,combat]);
  const addToCombat=function(entry){setCombat(function(p){var base=entry.name||"Creature";var existing=(p.combatants||[]).filter(function(c){return c.name===base||c.name.indexOf(base+" ")===0;}).length;var nc=entryToCombatant(entry);if(existing>0)nc.name=base+" "+(existing+1);return Object.assign({},p,{combatants:[...(p.combatants||[]),nc]});});flashAdd(entry.name||"Creature");};
  const doSave=async function(){
    var json=JSON.stringify({version:"dm1",notes:notes,combat:combat},null,2);
    var fileName="dm_screen.json";
    var blob=new Blob([json],{type:"application/json"});
    var pickerOpts={suggestedName:fileName,types:[{description:"DM Screen JSON",accept:{"application/json":[".json"]}}]};
    // Desktop Chrome/Edge: native Save-As picker (choose folder + name), remembers file for re-save
    if(window.showSaveFilePicker){
      try{
        var handle=fileHandle.current;
        if(!handle){handle=await window.showSaveFilePicker(pickerOpts);fileHandle.current=handle;}
        var w=await handle.createWritable();await w.write(json);await w.close();
        flashSave("Saved to "+handle.name);return;
      }catch(e){
        if(e&&e.name==="AbortError")return; // user cancelled
        if(fileHandle.current){ // stale handle — ask for a new location once
          fileHandle.current=null;
          try{var h2=await window.showSaveFilePicker(pickerOpts);fileHandle.current=h2;var w2=await h2.createWritable();await w2.write(json);await w2.close();flashSave("Saved to "+h2.name);return;}
          catch(e2){if(e2&&e2.name==="AbortError")return;}
        }
        // otherwise fall through to share/download
      }
    }
    // Mobile: Web Share sheet (lets you pick a destination app/location)
    try{
      var shareFile=new File([blob],fileName,{type:"application/json"});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[shareFile]})){
        await navigator.share({files:[shareFile],title:fileName});flashSave("Saved");return;
      }
    }catch(e){if(e&&(e.name==="AbortError"||e.name==="NotAllowedError"))return;}
    // Fallback: classic download
    try{var u=URL.createObjectURL(blob);var el=document.createElement("a");el.href=u;el.download=fileName;document.body.appendChild(el);el.click();document.body.removeChild(el);setTimeout(function(){URL.revokeObjectURL(u);},1000);flashSave("Downloaded");}
    catch(err){alert("Save failed: "+err.message);}
  };
  const doSaveAs=function(){fileHandle.current=null;doSave();};

          <span style={{fontFamily:"'Cinzel',serif",fontSize:8,letterSpacing:1.5,textTransform:"uppercase",color:"rgba(232,213,176,.35)"}}>Reference</span>

        {DM_TOOLS.map(function(t){return <React.Fragment key={t.id}>{tabBtn(t.id,t.label,t.col)}</React.Fragment>;})}
      </div>
    </div>
    <div style={{display:tab==="combat"?"block":"none"}}><CombatTracker combat={combat} setCombat={setCombat} setLightbox={setLightbox} onAddCreature={addToCombat}/></div>
    {tab==="compendium"&&<div style={{maxWidth:980,margin:"0 auto"}}><CompendiumPage onAddCreature={addToCombat}/></div>}
    {tab==="codex"&&<div style={{maxWidth:980,margin:"0 auto"}}><Page4 c={notes} s={notesS}/></div>}
    <div style={{maxWidth:1500,margin:"0 auto",display:DM_TOOLS.some(function(t){return t.id===tab;})?"block":"none"}}>
      <PartyHpStrip combat={combat} setCombat={setCombat}/>
      {DM_TOOLS.map(function(t){return <ToolFrame key={t.id} tool={t} active={tab===t.id}/>;})}
    </div>
    <datalist id="cond-list">{COMMON_CONDITIONS.map(function(x){return <option key={x} value={x}/>;})}</datalist>
    {lightbox&&<div onClick={function(){setLightbox(null);}} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.9)",zIndex:100001,display:"flex",alignItems:"center",justifyContent:"center",padding:20,cursor:"zoom-out"}}><img src={lightbox} style={{maxWidth:"95vw",maxHeight:"95vh",objectFit:"contain"}}/></div>}
    {addMsg&&<div style={{position:"fixed",top:64,left:"50%",transform:"translateX(-50%)",zIndex:100002,pointerEvents:"none",maxWidth:"92vw"}}>
      <div key={addMsg.id} style={{animation:"dmPop .2s ease-out",display:"flex",alignItems:"center",gap:10,padding:"10px 18px",borderRadius:8,background:"rgba(28,21,16,.97)",border:"1px solid rgba(123,79,207,.55)",boxShadow:"0 8px 30px rgba(0,0,0,.6)"}}>
        <span style={{fontSize:17}}>⚔️</span>
        <span style={{fontFamily:"'Cinzel',serif",fontSize:14,color:ARCL,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{addMsg.name} added to combat</span>
      </div>
    </div>}
    <div style={{textAlign:"center",padding:"18px 0 10px",fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:2,color:"rgba(201,150,42,.35)",userSelect:"none"}}>DM Screen · v1.17.3</div>
    {confirmState.open&&<ConfirmModal message={confirmState.message} confirmLabel={confirmState.confirmLabel} onYes={function(){if(confirmState.onConfirm)confirmState.onConfirm();setConfirmState({open:false,message:"",onConfirm:null});}} onNo={function(){setConfirmState({open:false,message:"",onConfirm:null});}}/>}
    <input type="file" accept="application/json,.json" ref={fileRef} style={{display:"none"}} onChange={doImport}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body></html>
